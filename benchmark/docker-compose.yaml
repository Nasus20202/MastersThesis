services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10964@sha256:43e0e25ca654d839ebda39fd6c2f200b36e9efb3e597ba90d0aaeff1be95ca53
    command:
      - --models-dir
      - /models
      - --models-max
      - "${LLAMA_MODELS_MAX:-1}"
      - --models-autoload
      - --models-preset
      - /models-preset.ini
      - --spec-type
      - "${LLAMA_SPEC_TYPE:-none}"
      - --spec-draft-n-max
      - "${LLAMA_SPEC_DRAFT_N_MAX:-3}"
      - --host
      - "${LLAMA_HOST:-0.0.0.0}"
      - --port
      - "${LLAMA_PORT:-8080}"
      - --kv-unified-per-slot
      - "${LLAMA_KV_UNIFIED_PER_SLOT:-32768}"
      - --parallel
      - "${LLAMA_PARALLEL:-1}"
      - --flash-attn
      - "${LLAMA_FLASH_ATTN:-auto}"
      - --cache-type-k
      - "${LLAMA_CACHE_TYPE_K:-f16}"
      - --cache-type-v
      - "${LLAMA_CACHE_TYPE_V:-f16}"
      - --n-gpu-layers
      - "${LLAMA_GPU_LAYERS:-999}"
      - --reasoning
      - "${LLAMA_REASONING:-auto}"
      - --reasoning-budget
      - "${LLAMA_REASONING_BUDGET:--1}"
    ports:
      - "${LLAMA_PUBLISH_HOST}:${LLAMA_PORT}:${LLAMA_PORT}"
    volumes:
      - type: bind
        source: ${LLAMA_MODEL_DIR:-./models}
        target: /models
        read_only: true
      - type: bind
        source: ./models-preset.ini
        target: /models-preset.ini
        read_only: true
    devices:
      - "${LLAMA_VULKAN_DEVICE:-/dev/dri/renderD128}:${LLAMA_VULKAN_DEVICE:-/dev/dri/renderD128}"

  docker-registry-cache:
    image: registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
    container_name: docker-registry-cache
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_LOG_LEVEL: info
    volumes:
      - docker-registry-cache-data:/var/lib/registry
    networks:
      - kind

  quay-registry-cache:
    image: registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
    container_name: quay-registry-cache
    environment:
      REGISTRY_PROXY_REMOTEURL: https://quay.io
      REGISTRY_LOG_LEVEL: info
    volumes:
      - quay-registry-cache-data:/var/lib/registry
    networks:
      - kind

  ghcr-registry-cache:
    image: registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
    container_name: ghcr-registry-cache
    environment:
      REGISTRY_PROXY_REMOTEURL: https://ghcr.io
      REGISTRY_LOG_LEVEL: info
    volumes:
      - ghcr-registry-cache-data:/var/lib/registry
    networks:
      - kind

volumes:
  docker-registry-cache-data:
  quay-registry-cache-data:
  ghcr-registry-cache-data:

networks:
  kind:
    external: true
