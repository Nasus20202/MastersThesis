services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10964@sha256:43e0e25ca654d839ebda39fd6c2f200b36e9efb3e597ba90d0aaeff1be95ca53
    command:
      - --models-dir
      - /models
      - --models-max
      - "${LLAMA_MODELS_MAX:-1}"
      - --models-autoload
      - --host
      - "${LLAMA_HOST:-0.0.0.0}"
      - --port
      - "${LLAMA_PORT:-8080}"
      - --kv-unified-per-slot
      - "${LLAMA_KV_UNIFIED_PER_SLOT:-32768}"
      - --parallel
      - "${LLAMA_PARALLEL:-1}"
      - --flash-attn
      - "${LLAMA_FLASH_ATTN:-auto}"
      - --cache-type-k
      - "${LLAMA_CACHE_TYPE_K:-f16}"
      - --cache-type-v
      - "${LLAMA_CACHE_TYPE_V:-f16}"
      - --n-gpu-layers
      - "${LLAMA_GPU_LAYERS:-999}"
      - --reasoning
      - "${LLAMA_REASONING:-auto}"
      - --reasoning-budget
      - "${LLAMA_REASONING_BUDGET:--1}"
    ports:
      - "${LLAMA_PUBLISH_HOST}:${LLAMA_PORT}:${LLAMA_PORT}"
    volumes:
      - type: bind
        source: ${LLAMA_MODEL_DIR:-./models}
        target: /models
        read_only: true
    devices:
      - "${LLAMA_VULKAN_DEVICE:-/dev/dri/renderD128}:${LLAMA_VULKAN_DEVICE:-/dev/dri/renderD128}"
