services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10524@sha256:1f834a5e0248d83c4cc459591a53250499592742f3c33f8830054e9ccb1c4c5b
    command:
      - --models-dir
      - /models
      - --models-preset
      - /models.ini
      - --models-max
      - "${LLAMA_MODELS_MAX:-1}"
      - --models-autoload
      - --host
      - "${LLAMA_HOST:-0.0.0.0}"
      - --port
      - "${LLAMA_PORT:-8080}"
      - --ctx-size
      - "${LLAMA_CONTEXT_SIZE:-32768}"
      - --parallel
      - "${LLAMA_PARALLEL:-1}"
      - --flash-attn
      - "${LLAMA_FLASH_ATTN:-auto}"
      - --cache-type-k
      - "${LLAMA_CACHE_TYPE_K:-f16}"
      - --cache-type-v
      - "${LLAMA_CACHE_TYPE_V:-f16}"
      - --n-gpu-layers
      - "${LLAMA_GPU_LAYERS:-99}"
    ports:
      - "${LLAMA_PORT:-8080}:${LLAMA_PORT:-8080}"
    volumes:
      - type: bind
        source: ${LLAMA_MODEL_DIR:-./models}
        target: /models
        read_only: true
      - type: bind
        source: ${LLAMA_MODEL_PRESET:-./models.ini}
        target: /models.ini
        read_only: true
    devices:
      - "${LLAMA_VULKAN_DEVICE:-/dev/dri/renderD128}:${LLAMA_VULKAN_DEVICE:-/dev/dri/renderD128}"
