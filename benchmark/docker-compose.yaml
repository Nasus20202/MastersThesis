services:
  # The llama.cpp image and device come from docker-compose.$LLAMA_DEVICE.yaml.
  llama-server:
    command:
      - --models-dir
      - /models
      - --models-max
      - "${LLAMA_MODELS_MAX:-1}"
      - --models-autoload
      - --models-preset
      - /models-preset.ini
      - --spec-type
      - "${LLAMA_SPEC_TYPE:-none}"
      - --spec-draft-n-max
      - "${LLAMA_SPEC_DRAFT_N_MAX:-3}"
      - --host
      - "${LLAMA_HOST:-0.0.0.0}"
      - --port
      - "${LLAMA_PORT:-8080}"
      - --kv-unified-per-slot
      - "${LLAMA_KV_UNIFIED_PER_SLOT:-32768}"
      - --parallel
      - "${LLAMA_PARALLEL:-1}"
      - --flash-attn
      - "${LLAMA_FLASH_ATTN:-auto}"
      - --cache-type-k
      - "${LLAMA_CACHE_TYPE_K:-f16}"
      - --cache-type-v
      - "${LLAMA_CACHE_TYPE_V:-f16}"
      - --n-gpu-layers
      - "${LLAMA_GPU_LAYERS:-999}"
      - --reasoning
      - "${LLAMA_REASONING:-auto}"
      - --reasoning-budget
      - "${LLAMA_REASONING_BUDGET:--1}"
    ports:
      - "${LLAMA_PUBLISH_HOST}:${LLAMA_PORT}:${LLAMA_PORT}"
    volumes:
      - type: bind
        source: ${LLAMA_MODEL_DIR:-./models}
        target: /models
        read_only: true
      - type: bind
        source: ./models-preset.ini
        target: /models-preset.ini
        read_only: true
    # The image default probes port 8080; check the configured port instead so
    # `up --wait` returns once the server answers.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LLAMA_PORT:-8080}/health"]
      interval: 5s
      start_period: 120s

  # EmbeddingGemma for the retrieval index and query embeddings. It runs apart
  # from llama-server so the chat runtime of the other conditions is unchanged.
  llama-embedding:
    command:
      - --model
      - /models/${EMBEDDING_MODEL_FILE}
      - --alias
      - ${EMBEDDING_MODEL_NAME}
      - --embeddings
      - --ctx-size
      - "${EMBEDDING_CTX_SIZE:-2048}"
      # Embedding inputs are not split, so a batch must hold a whole chunk.
      - --batch-size
      - "${EMBEDDING_CTX_SIZE:-2048}"
      - --ubatch-size
      - "${EMBEDDING_CTX_SIZE:-2048}"
      - --n-gpu-layers
      - "${LLAMA_GPU_LAYERS:-999}"
      - --host
      - "${LLAMA_HOST:-0.0.0.0}"
      - --port
      - "${EMBEDDING_PORT:-8081}"
      - --no-webui
    ports:
      - "${LLAMA_PUBLISH_HOST}:${EMBEDDING_PORT}:${EMBEDDING_PORT}"
    volumes:
      - type: bind
        source: ${EMBEDDING_MODEL_DIR:-./models/embedding}
        target: /models
        read_only: true
    # The image default probes port 8080; check the configured port instead so
    # `up --wait` returns once the server answers.
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${EMBEDDING_PORT:-8081}/health"]
      interval: 5s
      start_period: 120s

  docker-registry-cache:
    image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
    container_name: docker-registry-cache
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_LOG_LEVEL: info
    volumes:
      - docker-registry-cache-data:/var/lib/registry
    networks:
      - kind

  quay-registry-cache:
    image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
    container_name: quay-registry-cache
    environment:
      REGISTRY_PROXY_REMOTEURL: https://quay.io
      REGISTRY_LOG_LEVEL: info
    volumes:
      - quay-registry-cache-data:/var/lib/registry
    networks:
      - kind

  ghcr-registry-cache:
    image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
    container_name: ghcr-registry-cache
    environment:
      REGISTRY_PROXY_REMOTEURL: https://ghcr.io
      REGISTRY_LOG_LEVEL: info
    volumes:
      - ghcr-registry-cache-data:/var/lib/registry
    networks:
      - kind

volumes:
  docker-registry-cache-data:
  quay-registry-cache-data:
  ghcr-registry-cache-data:

networks:
  kind:
    external: true
