version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - errname
    - gochecknoinits
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - predeclared
    - revive
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - appendCombine
        - hugeParam
        - rangeValCopy
    gosec:
      excludes:
        # Scenario, config and results paths are user-supplied by design.
        - G204
        - G304
        # Results directories and kubeconfigs use the process umask.
        - G301
        - G306
    staticcheck:
      checks:
        - all
        - -QF1003
        - -QF1008
        - -QF1012
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gocritic
          - gosec
          - revive
          - unparam
      - linters:
          - revive
        text: "stutters"
