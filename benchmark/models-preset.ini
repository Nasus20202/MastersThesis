version = 1

; Router presets. Section keys are the model names the router derives from the
; file names in the model directory, so they match LLAMA_MODEL_NAME in the
; profiles.
;
; Multi-token prediction: Gemma 4 ships its MTP drafter as a separate GGUF, so
; each Gemma target is pointed at its own downloaded drafter. Qwen3.5 carries
; the MTP layer inside the target artifact and needs no drafter.
;
; Sampling: the model vendor's recommended values, identical in every
; condition. Parameters the vendor does not name are disabled (min-p 0, no
; penalties) instead of falling back to llama.cpp defaults.
; - Gemma 4: google/gemma-4-E2B-it@3e22461f65e89153144f8adb70e3b8c2cc9845a7 and
;   google/gemma-4-E4B-it@ee0ef6023621cff504d758262d4e04895a5af4a2, README
;   "Sampling Parameters".
; - Qwen3.5: Qwen/Qwen3.5-4B@851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a and
;   Qwen/Qwen3.5-9B@c202236235762e1c871ad0ccb60c8ee5ba337b9a, README "Best
;   Practices", thinking mode for general tasks.

[gemma-4-E2B-it-qat-UD-Q4_K_XL]
model-draft = /models/drafts/mtp-gemma-4-E2B-it-Q8_0.gguf
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

[gemma-4-E4B-it-qat-UD-Q4_K_XL]
model-draft = /models/drafts/mtp-gemma-4-E4B-it-Q8_0.gguf
temp = 1.0
