version = 1

; Router presets for multi-token prediction. Gemma 4 ships its MTP drafter as a
; separate GGUF, so each Gemma target is pointed at its own downloaded drafter.
; Qwen3.5 carries the MTP layer inside the target artifact and needs no entry
; here. Section keys are the model names the router derives from the file names
; in the model directory, so they match LLAMA_MODEL_NAME in the profiles.

[gemma-4-E2B-it-qat-UD-Q4_K_XL]
model-draft = /models/drafts/mtp-gemma-4-E2B-it-Q8_0.gguf

[gemma-4-E4B-it-qat-UD-Q4_K_XL]
model-draft = /models/drafts/mtp-gemma-4-E4B-it-Q8_0.gguf
