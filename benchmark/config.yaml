# Benchmark-specific settings. Llama.cpp runtime and model settings remain in
# config.env and model-profiles/*.env.
logging:
  level: info
  format: text
  color: auto

agents:
  # Provisional development limits (D-039).
  loop:
    max_turns: 50
    max_tool_calls: 100
    tool_timeout_seconds: 60
    timeout_seconds: 1800
    max_tokens: 8192
    max_output_bytes: 8192
  prompt:
    system_prompt_file: internal/agent/prompt/prompt.md
  skill:
    system_prompt_file: internal/agent/skill/prompt.md
    skills_dir: internal/agent/skill/skills
  rag:
    system_prompt_file: internal/agent/rag/prompt.md

containers:
  cleanup_timeout_seconds: 30
  sandbox:
    image: benchmark-sandbox:ubuntu-26.04
    dockerfile: docker/sandbox/Dockerfile.ubuntu-26.04
    context: docker/sandbox
  setup:
    image: benchmark-setup:ubuntu-26.04
    dockerfile: docker/setup/Dockerfile.ubuntu-26.04
    context: docker/setup
    network: kind

# Retrieval for the RAG condition, selected by the retrieval design study
# (D-035).
retrieval:
  mode: hybrid
  chunking: windows
  top_k: 5
  max_bytes: 8192
  index_dir: corpus
  max_chunk_bytes: 1536
  window_overlap: 256
  hybrid_candidates: 50
  rrf_k: 60
