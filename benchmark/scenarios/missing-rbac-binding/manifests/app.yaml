apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  message: healthy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-config-reader
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [app-config]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-config-reader
subjects:
  - kind: ServiceAccount
    name: config-reader
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-config-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      serviceAccountName: config-reader
      initContainers:
        - name: read-config
          image: nginx:1.31.5
          command: [sh, -ec]
          args:
            - >-
              curl --fail --silent --show-error
              --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              --header "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              https://kubernetes.default.svc/api/v1/namespaces/default/configmaps/app-config
              >/dev/null
      containers:
        - name: app
          image: nginx:1.31.5
