scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                rolebinding,
                app-config-reader,
                --type=json,
                -p,
                '[{"op":"replace","path":"/subjects/0/name","value":"config-reader"}]',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                rolebinding,
                app-config-reader,
                --type=json,
                -p,
                '[{"op":"replace","path":"/subjects/0/name","value":"config-reader"}]',
              ]
          - program: kubectl
            args:
              [
                create,
                rolebinding,
                config-reader-view,
                --clusterrole=view,
                --serviceaccount=default:config-reader,
              ]
        expected_score: 0.5
        expected_full_success: false
