id: missing-rbac-binding
title: Missing RBAC binding
task: An in-cluster configuration reader is unhealthy. Restore it while preserving least-privilege access.

cluster:
  kind:
    config: kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=120s]
  - program: sh
    args: [scripts/check-least-privilege.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

reset:
  - program: kubectl
    args: [delete, rolebinding, config-reader-view, --ignore-not-found]
  - program: kubectl
    args: [apply, -f, manifests/app.yaml]
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=120s]
  - program: sh
    args: [scripts/check-least-privilege.sh]

grading:
  - id: deployment-ready
    weight: 1
    check:
      program: kubectl
      args: [rollout, status, deployment/app, --timeout=60s]
  - id: least-privilege-access
    weight: 1
    check:
      program: sh
      args: [scripts/check-least-privilege.sh]
