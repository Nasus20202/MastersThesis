id: readiness-probe-breaks-endpoints
title: Readiness probe breaks endpoints
tags:
  difficulty: medium
  task_type: troubleshooting
  knowledge: documentation-dependent
  area: pods
sources:
  - path: content/en/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes.md
    sections:
      - Define readiness probes
task: The application Pods are running, but the application is unavailable through its Kubernetes Service. Restore service availability.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: sh
    args: [scripts/verify-clean.sh]

grading:
  - id: ready-service-endpoints
    weight: 1
    check:
      program: sh
      args: [scripts/check-ready-endpoints.sh]
  - id: service-response
    weight: 1
    check:
      program: sh
      args: [scripts/check-service-response.sh]
