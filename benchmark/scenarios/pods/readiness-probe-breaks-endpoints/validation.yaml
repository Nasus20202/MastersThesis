scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"app","readinessProbe":{"httpGet":{"path":"/","port":80}}}]}}}}',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-scaled
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"app","readinessProbe":{"httpGet":{"path":"/","port":80}}}]}}}}',
              ]
          - program: kubectl
            args: [scale, deployment/app, --replicas=1]
        expected_score: 0.5
        expected_full_success: false
