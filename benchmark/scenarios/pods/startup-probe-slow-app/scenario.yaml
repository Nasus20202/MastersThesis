id: startup-probe-slow-app
title: Slow-starting application killed before it serves
task: A slow-starting application Pod is killed before it can serve requests and never becomes Ready. Restore it to a stable, Ready state.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=120s]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: pod-ready
    weight: 2
    check:
      program: sh
      args: [scripts/check-pod-ready.sh]
  - id: no-restarts
    weight: 1
    check:
      program: sh
      args: [scripts/check-no-restarts.sh]
