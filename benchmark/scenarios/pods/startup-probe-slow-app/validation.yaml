scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"app","readinessProbe":{"httpGet":{"path":"/","port":80}},"livenessProbe":{"httpGet":{"path":"/","port":80},"periodSeconds":10,"failureThreshold":3},"startupProbe":{"httpGet":{"path":"/","port":80},"periodSeconds":2,"failureThreshold":15}}]}}}}',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-not-ready
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"app","readinessProbe":{"httpGet":{"path":"/notready","port":80}},"livenessProbe":{"httpGet":{"path":"/","port":80},"periodSeconds":10,"failureThreshold":3},"startupProbe":{"httpGet":{"path":"/","port":80},"periodSeconds":2,"failureThreshold":15}}]}}}}',
              ]
        expected_score: 0.3333333333333333
        expected_full_success: false
