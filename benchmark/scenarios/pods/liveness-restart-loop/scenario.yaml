id: liveness-restart-loop
title: Liveness probe restarts a healthy container
task: The application Pods keep restarting and never stay Ready. Restore them to a stable, Ready state.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=90s]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: pod-ready
    weight: 2
    check:
      program: sh
      args: [scripts/check-pod-ready.sh]
  - id: restarts-stable
    weight: 2
    check:
      program: sh
      args: [scripts/check-restarts-stable.sh]
