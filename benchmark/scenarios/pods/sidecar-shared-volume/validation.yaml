scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: sh
            args:
              - -c
              - |
                set -e
                kubectl delete pod app --wait=true --timeout=60s
                kubectl create -f manifests/app-fixed.yaml
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-no-content
        repair:
          - program: sh
            args:
              - -c
              - |
                set -e
                kubectl delete pod app --wait=true --timeout=60s
                kubectl create -f manifests/app-partial.yaml
        expected_score: 0.5
        expected_full_success: false
