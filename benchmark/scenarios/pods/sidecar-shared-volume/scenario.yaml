id: sidecar-shared-volume
title: Serve a page written by a sidecar through a shared volume
task: The Pod named app runs a web server that currently serves an empty directory. Make the Pod serve a web page at the root path by adding a second container that writes the page into a volume shared with the web server.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: sh
    args: [scripts/create-app.sh]

verify_clean:
  - program: sh
    args: [scripts/verify-clean.sh]

grading:
  - id: both-ready
    weight: 1
    check:
      program: sh
      args: [scripts/check-both-ready.sh]
  - id: shared-volume
    weight: 1
    check:
      program: sh
      args: [scripts/check-shared-volume.sh]
  - id: content-served
    weight: 2
    check:
      program: sh
      args: [scripts/check-content-served.sh]
