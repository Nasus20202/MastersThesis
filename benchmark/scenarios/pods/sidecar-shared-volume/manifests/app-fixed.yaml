apiVersion: v1
kind: Pod
metadata:
  name: app
  labels:
    app: app
spec:
  containers:
    - name: web
      image: busybox:1.37.0
      command: ["sh", "-c", "httpd -f -p 8080 -h /srv"]
      ports:
        - name: http
          containerPort: 8080
      volumeMounts:
        - name: shared
          mountPath: /srv
    - name: content
      image: busybox:1.37.0
      command:
        [
          "sh",
          "-c",
          "echo '<html><body>sidecar-content-ok</body></html>' > /srv/index.html; exec sleep 3600",
        ]
      volumeMounts:
        - name: shared
          mountPath: /srv
  volumes:
    - name: shared
      emptyDir: {}
