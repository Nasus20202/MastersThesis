scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0.3333333333333333
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"app","resources":{"requests":{"cpu":"100m","memory":"128Mi"},"limits":{"cpu":"100m","memory":"128Mi"}}}]}}}}',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-scaled
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"app","resources":{"requests":{"cpu":"100m","memory":"128Mi"},"limits":{"cpu":"100m","memory":"128Mi"}}}]}}}}',
              ]
          - program: kubectl
            args: [scale, deployment/app, --replicas=1]
        expected_score: 0.6666666666666666
        expected_full_success: false
