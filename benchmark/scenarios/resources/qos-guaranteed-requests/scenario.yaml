id: qos-guaranteed-requests
title: Workload must run with Guaranteed QoS
task: The application currently runs without any resource guarantees. Reconfigure the workload so its Pods are admitted with Guaranteed QoS while remaining available.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: sh
    args: [scripts/verify-clean.sh]

grading:
  - id: guaranteed-qos
    weight: 2
    check:
      program: sh
      args: [scripts/check-qos-guaranteed.sh]
  - id: replicas-ready
    weight: 1
    check:
      program: sh
      args: [scripts/check-ready-replicas.sh]
