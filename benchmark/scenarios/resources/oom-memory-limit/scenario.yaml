id: oom-memory-limit
title: Container repeatedly killed by its memory limit
tags:
  difficulty: easy
  task_type: troubleshooting
  knowledge: general
  area: resources
sources:
  - path: content/en/docs/tasks/configure-pod-container/assign-memory-resource.md
    sections:
      - Specify a memory request and a memory limit
      - Exceed a Container's memory limit
task: A Kubernetes application is restarting repeatedly and never stays healthy. Restore it to a stable, Ready state.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: pods-ready
    weight: 2
    check:
      program: sh
      args: [scripts/check-pods-ready.sh]
  - id: restarts-stable
    weight: 1
    check:
      program: sh
      args: [scripts/check-restarts-stable.sh]
