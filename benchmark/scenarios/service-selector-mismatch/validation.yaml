scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                service,
                app,
                --type=merge,
                -p,
                '{"spec":{"selector":{"app":"app"}}}',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                service,
                app,
                --type=merge,
                -p,
                '{"spec":{"selector":{"app":"app"}}}',
              ]
          - program: kubectl
            args: [scale, deployment/app, --replicas=1]
          - program: sh
            args: [scripts/check-ready-endpoints.sh, "1"]
        expected_score: 0.5
        expected_full_success: false
