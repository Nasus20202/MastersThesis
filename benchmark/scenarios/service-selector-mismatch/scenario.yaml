id: service-selector-mismatch
title: Service selector mismatch
task: The application Pods are healthy, but the application is unavailable through its Kubernetes Service. Restore service availability.

cluster:
  kind:
    config: kind/cluster.yaml

prepare:
  - program: kubectl
    args: [apply, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]
  - program: sh
    args: [scripts/check-ready-endpoints.sh]
  - program: sh
    args: [scripts/check-service-response.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

reset:
  - program: kubectl
    args: [apply, -f, manifests/app.yaml]
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]
  - program: sh
    args: [scripts/check-ready-endpoints.sh]
  - program: sh
    args: [scripts/check-service-response.sh]

grading:
  - id: ready-service-endpoints
    weight: 1
    check:
      program: sh
      args: [scripts/check-ready-endpoints.sh]
  - id: service-response
    weight: 1
    check:
      program: sh
      args: [scripts/check-service-response.sh]
