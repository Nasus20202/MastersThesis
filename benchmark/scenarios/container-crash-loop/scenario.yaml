id: container-crash-loop
title: Container crash loop
task: An application in the Kubernetes cluster is unhealthy. Restore it to a healthy state.

cluster:
  kind:
    config: kind/cluster.yaml

prepare:
  - program: kubectl
    args: [apply, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

reset:
  - program: sh
    args:
      - -c
      - kubectl patch deployment app --type=strategic -p '{"spec":{"template":{"spec":{"containers":[{"name":"app","args":null}]}}}}'
  - program: kubectl
    args: [apply, -f, manifests/app.yaml]
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]

grading:
  - id: deployment-ready
    weight: 1
    check:
      program: kubectl
      args: [rollout, status, deployment/app, --timeout=60s]
  - id: replica-capacity
    weight: 1
    check:
      program: sh
      args: [scripts/check-replica-capacity.sh]
