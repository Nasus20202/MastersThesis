scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: sh
            args:
              - -c
              - kubectl patch deployment app --type=strategic -p '{"spec":{"template":{"spec":{"containers":[{"name":"app","args":null}]}}}}'
        expected_score: 1
        expected_full_success: true

      - id: partial-repair
        repair:
          - program: sh
            args:
              - -c
              - kubectl patch deployment app --type=strategic -p '{"spec":{"template":{"spec":{"containers":[{"name":"app","args":null}]}}}}'
          - program: kubectl
            args: [scale, deployment/app, --replicas=1]
        expected_score: 0.5
        expected_full_success: false
