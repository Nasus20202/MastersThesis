id: antiaffinity-unschedulable
title: Unsatisfiable required pod anti-affinity
task: A Kubernetes application rollout is stuck with some replicas never becoming Ready while the rest of the workload stays healthy. Restore all three replicas to a Ready state without reducing the replica count.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: replicas-ready
    weight: 2
    check:
      program: sh
      args: [scripts/check-ready-replicas.sh]
  - id: no-required-antiaffinity
    weight: 1
    check:
      program: sh
      args: [scripts/check-no-required-antiaffinity.sh]
