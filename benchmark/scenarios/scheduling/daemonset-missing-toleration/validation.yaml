scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                daemonset,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"tolerations":[{"key":"benchmark","operator":"Equal","value":"daemonset","effect":"NoSchedule"}]}}}}',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-taint-removed
        repair:
          - program: sh
            args: [scripts/remove-taint.sh]
        expected_score: 0.6666666666666666
        expected_full_success: false
