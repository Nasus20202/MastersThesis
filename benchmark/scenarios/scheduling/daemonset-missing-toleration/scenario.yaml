id: daemonset-missing-toleration
title: DaemonSet missing a node toleration
task: A DaemonSet is not running on every node it should cover, so its node-level function is missing on part of the cluster. Restore the DaemonSet so it is ready on every node it should target, without modifying the cluster nodes.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/daemonset.yaml]
  - program: kubectl
    args: [rollout, status, daemonset/app, --timeout=90s]

verify_clean:
  - program: kubectl
    args: [rollout, status, daemonset/app, --timeout=60s]
  - program: sh
    args: [scripts/check-daemonset-ready.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: daemonset-ready
    weight: 2
    check:
      program: sh
      args: [scripts/check-daemonset-ready.sh]
  - id: taint-intact
    weight: 1
    check:
      program: sh
      args: [scripts/check-taint-intact.sh]
