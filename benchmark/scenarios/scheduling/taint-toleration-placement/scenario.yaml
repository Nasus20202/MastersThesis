id: taint-toleration-placement
title: Taint and toleration placement
task: The cluster node carries the taint dedicated=gpu:NoSchedule. Deploy a Deployment named app with image nginx:1.31.5 and three replicas that tolerates this taint, without removing the taint from the node.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: sh
    args: [scripts/prepare.sh]

verify_clean:
  - program: sh
    args: [scripts/verify-clean.sh]

grading:
  - id: deployment-ready
    weight: 1
    check:
      program: kubectl
      args: [rollout, status, deployment/app, --timeout=60s]
  - id: taint-tolerated
    weight: 1
    check:
      program: sh
      args: [scripts/check-taint-tolerated.sh]
