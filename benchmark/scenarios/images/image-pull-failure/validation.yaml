scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [set, image, deployment/app, app=nginx:1.31.5]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair
        repair:
          - program: kubectl
            args: [set, image, deployment/app, app=nginx:1.31.5]
          - program: kubectl
            args: [scale, deployment/app, --replicas=1]
        expected_score: 0.5
        expected_full_success: false
