scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                create,
                secret,
                docker-registry,
                regcred,
                --docker-server=registry:5000,
                --docker-username=benchmark,
                --docker-password=benchmark-pass,
              ]
          - program: kubectl
            args: [apply, -f, manifests/app.yaml]
        expected_score: 1
        expected_full_success: true
