id: private-registry-pull-secret
title: Image from an authenticated registry
task: >-
  Deploy the application image registry:5000/private/hello:1.0 as a
  Deployment named app with three replicas in the default namespace, so that all
  replicas become available. The registry requires authentication with username
  benchmark and password benchmark-pass.
cluster:
  kind:
    config: ../../../kind/cluster-registry.yaml

prepare:
  - program: sh
    args: [scripts/start-registry.sh]

verify_clean:
  - program: sh
    args: [scripts/check-registry.sh]

grading:
  - id: pull-secret
    weight: 1
    check:
      program: sh
      args: [scripts/check-pull-secret.sh]
  - id: app-ready
    weight: 2
    check:
      program: sh
      args: [scripts/check-app-ready.sh]
