scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0.3333333333333333
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"app","imagePullPolicy":"Always"}]}}}}',
              ]
        expected_score: 1
        expected_full_success: true
