id: stale-image-ifnotpresent
title: Republished image tag is not picked up
task: >-
  A new build of the application image was published under the existing
  "stable" tag, but the running Pods still use the previously cached build. Make
  the Deployment run the currently published image while keeping the tag
  unchanged.
cluster:
  kind:
    config: ../../../kind/cluster-registry.yaml

prepare:
  - program: sh
    args: [scripts/start-registry.sh]
  - program: kubectl
    args: [apply, -f, manifests/app.yaml]

verify_clean:
  - program: sh
    args: [scripts/check-app-response.sh]

inject_fault:
  - program: sh
    args: [scripts/publish-new-build.sh]

verify_fault:
  - program: sh
    args: [scripts/check-stale.sh]

grading:
  - id: current-image
    weight: 2
    check:
      program: sh
      args: [scripts/check-current-image.sh]
  - id: deployment-ready
    weight: 1
    check:
      program: kubectl
      args: [rollout, status, deployment/app, --timeout=120s]
