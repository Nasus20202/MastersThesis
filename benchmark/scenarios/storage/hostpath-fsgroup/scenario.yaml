id: hostpath-fsgroup
title: Non-root container cannot write a hostPath volume
task: An application keeps restarting and its rollout is not completing. Restore the application to a healthy state.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/setup-perms.yaml]
  - program: kubectl
    args: [wait, --for=condition=complete, job/data-perms, --timeout=60s]
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=120s]
  - program: sh
    args: [scripts/check-volume-writable.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: volume-writable
    weight: 2
    check:
      program: sh
      args: [scripts/check-volume-writable.sh]
  - id: pod-ready
    weight: 1
    check:
      program: sh
      args: [scripts/check-pod-ready.sh]
