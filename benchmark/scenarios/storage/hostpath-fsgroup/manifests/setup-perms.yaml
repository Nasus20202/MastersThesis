apiVersion: batch/v1
kind: Job
metadata:
  name: data-perms
  labels:
    app: data-perms
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: data-perms
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: busybox:1.37.0
          command: [sh, -ec]
          args:
            - mkdir -p /data && chown 1000:1000 /data && chmod 0775 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /tmp/hostpath-fsgroup/data
            type: DirectoryOrCreate
