apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      initContainers:
        - name: make-volume-writable
          image: busybox:1.37.0
          command: [sh, -ec]
          args:
            - chown 1000:1000 /data && chmod 0775 /data
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: app
          image: busybox:1.37.0
          command: [sh, -ec]
          args:
            - |
              while true; do
                echo alive > /data/heartbeat
                sleep 5
              done
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /tmp/hostpath-fsgroup/data
            type: Directory
