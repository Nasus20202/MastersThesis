apiVersion: batch/v1
kind: Job
metadata:
  name: data-perms-break
  labels:
    app: data-perms-break
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: data-perms-break
    spec:
      restartPolicy: Never
      containers:
        - name: break
          image: busybox:1.37.0
          command: [sh, -ec]
          args:
            - rm -f /data/heartbeat && chown 0:0 /data && chmod 0700 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /tmp/hostpath-fsgroup/data
            type: Directory
