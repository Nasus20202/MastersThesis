id: bind-precreated-pv
title: Bind a claim to a pre-created PersistentVolume
task: The cluster has a pre-created PersistentVolume named app-pv with storageClassName manual and 1Gi capacity. Create a PersistentVolumeClaim named app-pvc that binds to it and a Pod named app (image nginx:1.31.5) that mounts the claim at /data.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/pv.yaml]

verify_clean:
  - program: sh
    args: [scripts/verify-clean.sh]

grading:
  - id: pvc-bound
    weight: 1
    check:
      program: sh
      args: [scripts/check-pvc-bound.sh]
  - id: pod-ready
    weight: 1
    check:
      program: kubectl
      args: [wait, --for=condition=Ready, pod/app, --timeout=60s]
