id: statefulset-volumeclaim
title: StatefulSet volume claim template cannot bind
task: A StatefulSet is not starting because its volume claim template cannot provision storage. Restore the StatefulSet to a healthy state with all of its claims bound.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/statefulset.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, statefulset/app, --timeout=120s]
  - program: sh
    args: [scripts/check-pvcs-bound.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: pvcs-bound
    weight: 2
    check:
      program: sh
      args: [scripts/check-pvcs-bound.sh]
  - id: pods-ready
    weight: 2
    check:
      program: sh
      args: [scripts/check-pods-ready.sh]
