scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [delete, statefulset, app, --ignore-not-found, --wait=true]
          - program: kubectl
            args: [delete, pod, -l, app=app, --ignore-not-found, --wait=true]
          - program: kubectl
            args: [delete, pvc, data-app-0, --ignore-not-found, --wait=true]
          - program: kubectl
            args: [delete, pvc, data-app-1, --ignore-not-found, --wait=true]
          - program: kubectl
            args: [apply, -f, manifests/statefulset.yaml]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-scaled
        repair:
          - program: kubectl
            args: [delete, statefulset, app, --ignore-not-found, --wait=true]
          - program: kubectl
            args: [delete, pod, -l, app=app, --ignore-not-found, --wait=true]
          - program: kubectl
            args: [delete, pvc, data-app-0, --ignore-not-found, --wait=true]
          - program: kubectl
            args: [delete, pvc, data-app-1, --ignore-not-found, --wait=true]
          - program: kubectl
            args: [apply, -f, manifests/statefulset.yaml]
          - program: kubectl
            args: [scale, statefulset/app, --replicas=1]
        expected_score: 0.5
        expected_full_success: false
