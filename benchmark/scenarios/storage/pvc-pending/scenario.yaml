id: pvc-pending
title: PersistentVolumeClaim stuck Pending
task: An application rollout is not completing because its PersistentVolumeClaim is stuck Pending. Restore the application to a healthy state with the claim bound.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=120s]
  - program: sh
    args: [scripts/check-pvc-bound.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: pvc-bound
    weight: 2
    check:
      program: sh
      args: [scripts/check-pvc-bound.sh]
  - id: pod-ready
    weight: 1
    check:
      program: sh
      args: [scripts/check-pod-ready.sh]
