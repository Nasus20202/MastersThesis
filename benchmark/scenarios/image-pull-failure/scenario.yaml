id: image-pull-failure
title: Image pull failure
task: Restore the application to its healthy state.

cluster:
  kind:
    config: kind/cluster.yaml

prepare:
  - program: kubectl
    args: [apply, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

reset:
  - program: kubectl
    args: [apply, -f, manifests/app.yaml]
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]

grading:
  - id: deployment-ready
    weight: 1
    check:
      program: kubectl
      args: [rollout, status, deployment/app, --timeout=60s]
  - id: deployment-replicas
    weight: 1
    check:
      program: sh
      args:
        - -c
        - test "$(kubectl get deployment app -o jsonpath='{.spec.replicas}')" = "3"
