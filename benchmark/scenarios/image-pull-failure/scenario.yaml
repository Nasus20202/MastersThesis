id: image-pull-failure
title: Image pull failure
task: An application in the Kubernetes cluster is unhealthy. Restore it to a healthy state.

cluster:
  kind:
    config: kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

reset:
  - program: kubectl
    args: [apply, -f, manifests/app.yaml]
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]

grading:
  - id: deployment-ready
    weight: 1
    check:
      program: kubectl
      args: [rollout, status, deployment/app, --timeout=60s]
  - id: deployment-updated-replicas
    weight: 1
    check:
      program: sh
      args:
        - -c
        - |-
          replicas="$(kubectl get deployment app -o jsonpath='{.spec.replicas}')"
          updated_replicas="$(kubectl get deployment app -o jsonpath='{.status.updatedReplicas}')"
          printf 'replicas=%s updated_replicas=%s\n' "$replicas" "$updated_replicas"
          test "$replicas" = "3" && test "$updated_replicas" = "3"
