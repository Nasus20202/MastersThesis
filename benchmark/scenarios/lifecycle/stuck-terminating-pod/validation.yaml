scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: sh
            args:
              - -c
              - |
                set -e
                kubectl patch pod app --type=merge -p '{"metadata":{"finalizers":null}}'
                kubectl wait --for=delete pod/app --timeout=60s
                kubectl create -f manifests/pod.yaml
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-finalizer-only
        repair:
          - program: sh
            args:
              - -c
              - |
                set -e
                kubectl patch pod app --type=merge -p '{"metadata":{"finalizers":null}}'
                kubectl wait --for=delete pod/app --timeout=60s
        expected_score: 0.6666666666666666
        expected_full_success: false
