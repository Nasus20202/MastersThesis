id: stuck-terminating-pod
title: Pod stuck Terminating because of a finalizer
task: A Pod named app is stuck in the Terminating state and cannot be removed. Replace the workload with a healthy Pod named app.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: sh
    args: [scripts/create-app.sh]

verify_clean:
  - program: kubectl
    args: [wait, --for=condition=Ready, pod/app, --timeout=60s]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: no-stuck-pod
    weight: 2
    check:
      program: sh
      args: [scripts/check-no-stuck-pod.sh]
  - id: replacement-ready
    weight: 1
    check:
      program: sh
      args: [scripts/check-replacement-ready.sh]
