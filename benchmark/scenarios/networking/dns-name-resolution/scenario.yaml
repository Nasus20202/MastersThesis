id: dns-name-resolution
title: Application cannot resolve its peer Service
task: An application in the default namespace is not becoming Ready and cannot reach its peer Service in the same namespace. Restore the application to a healthy state.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/peer, --timeout=60s]
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=90s]
  - program: sh
    args: [scripts/check-name-resolution.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: name-resolution
    weight: 2
    check:
      program: sh
      args: [scripts/check-name-resolution.sh]
  - id: app-ready
    weight: 1
    check:
      program: sh
      args: [scripts/check-app-ready.sh]
