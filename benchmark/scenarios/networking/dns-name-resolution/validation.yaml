scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"client","env":[{"name":"PEER_HOST","value":"peer"}]}]}}}}',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-scaled
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"client","env":[{"name":"PEER_HOST","value":"peer"}]}]}}}}',
              ]
          - program: kubectl
            args: [scale, deployment/app, --replicas=1]
        expected_score: 0.6666666666666666
        expected_full_success: false
