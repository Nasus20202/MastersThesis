apiVersion: apps/v1
kind: Deployment
metadata:
  name: peer
  labels:
    app: peer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peer
  template:
    metadata:
      labels:
        app: peer
    spec:
      containers:
        - name: peer
          image: nginx:1.31.5
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: peer
spec:
  selector:
    app: peer
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: client
          image: busybox:1.37.0
          command: [sh, -c]
          args:
            - |
              while true; do
                if wget -q -O - -T 3 "http://$PEER_HOST/" 2>/dev/null | grep -q "Welcome to nginx!"; then
                  echo ok > /shared/status
                else
                  echo fail > /shared/status
                fi
                sleep 2
              done
          env:
            - name: PEER_HOST
              value: peer
          readinessProbe:
            exec:
              command: [sh, -c, "grep -q ok /shared/status"]
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          emptyDir: {}
