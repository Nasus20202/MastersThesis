scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                service,
                app,
                --type=merge,
                -p,
                '{"spec":{"ports":[{"name":"http","port":80,"targetPort":80,"protocol":"TCP"}]}}',
              ]
        expected_score: 1
        expected_full_success: true
