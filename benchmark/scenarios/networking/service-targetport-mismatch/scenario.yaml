id: service-targetport-mismatch
title: Service target port mismatch
tags:
  difficulty: medium
  task_type: troubleshooting
  knowledge: documentation-dependent
  area: networking
sources:
  - path: content/en/docs/concepts/services-networking/service.md
    sections:
      - Defining a Service
task: The application Pods are healthy and the Service has ready endpoints, but the application is unavailable through the Service. Restore service availability.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]
  - program: sh
    args: [scripts/check-ready-endpoints.sh]
  - program: sh
    args: [scripts/check-service-response.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: target-port-correct
    weight: 1
    check:
      program: sh
      args: [scripts/check-target-port.sh]
  - id: service-response
    weight: 1
    check:
      program: sh
      args: [scripts/check-service-response.sh]
