id: headless-service-dns
title: Headless Service for StatefulSet DNS
task: A StatefulSet named app runs two replicas, but the headless Service that provides their stable per-Pod DNS names is missing. Create a headless Service named app in the default namespace with clusterIP None, selector app=app and port 80.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/statefulset.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, statefulset/app, --timeout=120s]
  - program: sh
    args: [scripts/verify-clean.sh]

grading:
  - id: headless-service
    weight: 1
    check:
      program: sh
      args: [scripts/check-headless-service.sh]
  - id: service-endpoints
    weight: 1
    check:
      program: sh
      args: [scripts/check-ready-endpoints.sh, "2"]
