apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  ingressClassName: traefik
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /wrong
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
