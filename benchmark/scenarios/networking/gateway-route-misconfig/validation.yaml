scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [apply, -f, manifests/gateway-good.yaml]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-wrong-path
        repair:
          - program: kubectl
            args: [apply, -f, manifests/gateway-good.yaml]
          - program: kubectl
            args:
              [
                patch,
                httproute,
                app-route,
                --type=json,
                -p,
                '[{"op":"replace","path":"/spec/rules/0/matches/0/path/value","value":"/wrong"}]',
              ]
        expected_score: 0.3333333333333333
        expected_full_success: false
