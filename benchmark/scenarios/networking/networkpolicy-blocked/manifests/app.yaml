apiVersion: v1
kind: Namespace
metadata:
  name: policy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: policy
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: nginx:1.31.5
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: policy
spec:
  selector:
    app: server
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-client
  namespace: policy
  labels:
    role: allowed
spec:
  containers:
    - name: client
      image: busybox:1.37.0
      command: [sh, -c]
      args: ["sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: blocked-client
  namespace: policy
  labels:
    role: blocked
spec:
  containers:
    - name: client
      image: busybox:1.37.0
      command: [sh, -c]
      args: ["sleep 3600"]
