id: networkpolicy-blocked
title: NetworkPolicy blocks required traffic
task: A required client can no longer reach the application server in the policy namespace. Restore the intended access while leaving all other traffic to the server blocked.

cluster:
  kind:
    config: ../../../kind/cluster-calico.yaml

prepare:
  - program: helm
    args:
      - upgrade
      - --install
      - calico-crds
      - oci://quay-registry-cache:5000/calico/charts/crd.projectcalico.org.v1
      - --plain-http
      - --namespace
      - tigera-operator
      - --create-namespace
      - --version
      # renovate: datasource=helm depName=crd.projectcalico.org.v1 registryUrl=https://docs.tigera.io/calico/charts
      - v3.32.2
      - --wait
      - --timeout
      - 300s
  - program: kubectl
    args:
      - wait
      - --for=condition=Established
      - crd/installations.operator.tigera.io
      - --timeout=60s
  - program: helm
    args:
      - upgrade
      - --install
      - calico
      - oci://quay-registry-cache:5000/calico/charts/tigera-operator
      - --plain-http
      - --namespace
      - tigera-operator
      - --create-namespace
      - --values
      - ../../../kind/addons/calico-values.yaml
      - --version
      # renovate: datasource=helm depName=tigera-operator registryUrl=https://docs.tigera.io/calico/charts
      - v3.32.2
      - --wait
      - --timeout
      - 300s
  - program: sh
    args: [scripts/wait-calico.sh]
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/server, -n, policy, --timeout=90s]
  - program: sh
    args: [scripts/verify-clean.sh]

inject_fault:
  - program: kubectl
    args: [apply, -f, manifests/networkpolicy-deny.yaml]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: allowed-path
    weight: 2
    check:
      program: sh
      args: [scripts/check-allowed-client.sh]
  - id: isolation
    weight: 2
    check:
      program: sh
      args: [scripts/check-isolation.sh]
