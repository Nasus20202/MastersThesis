scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [apply, -f, manifests/networkpolicy-allow-egress.yaml]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-allow-all
        repair:
          - program: kubectl
            args: [apply, -f, manifests/networkpolicy-allow-all-egress.yaml]
        expected_score: 0.8
        expected_full_success: false
