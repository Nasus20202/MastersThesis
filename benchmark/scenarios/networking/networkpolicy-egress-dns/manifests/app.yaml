apiVersion: v1
kind: Namespace
metadata:
  name: egress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep
  namespace: egress
  labels:
    app: dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dep
  template:
    metadata:
      labels:
        app: dep
    spec:
      containers:
        - name: dep
          image: nginx:1.31.5
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dep
  namespace: egress
spec:
  selector:
    app: dep
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: other
  namespace: egress
  labels:
    app: other
spec:
  replicas: 1
  selector:
    matchLabels:
      app: other
  template:
    metadata:
      labels:
        app: other
    spec:
      containers:
        - name: other
          image: nginx:1.31.5
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: other
  namespace: egress
spec:
  selector:
    app: other
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: egress
  labels:
    app: app
spec:
  containers:
    - name: app
      image: busybox:1.37.0
      command: [sh, -c]
      args: ["sleep 3600"]
