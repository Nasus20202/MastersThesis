scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [apply, -f, manifests/gateway.yaml]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-gateway-only
        repair:
          - program: kubectl
            args: [apply, -f, manifests/gateway-only.yaml]
        expected_score: 0.25
        expected_full_success: false
