id: gateway-httproute-basic
title: Expose a Service with Gateway API
task: The Service app in the default namespace is healthy. Expose it with the Gateway API by creating a Gateway named app-gateway (gatewayClassName traefik) with an HTTP listener named http on port 8000, and an HTTPRoute named app-route that routes host app.example.com and path /app (PathPrefix) to Service app on port 80. Requests are served through the traefik Service on port 80.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args:
      - apply
      - -f
      # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
      - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.2/standard-install.yaml
  - program: kubectl
    args:
      - wait
      - --for=condition=Established
      - crd/gatewayclasses.gateway.networking.k8s.io
      - crd/gateways.gateway.networking.k8s.io
      - crd/httproutes.gateway.networking.k8s.io
      - --timeout=60s
  - program: helm
    args:
      - upgrade
      - --install
      - traefik
      - oci://ghcr-registry-cache:5000/traefik/helm/traefik
      - --plain-http
      - --namespace
      - traefik
      - --create-namespace
      - --values
      - ../../../kind/addons/traefik-gateway-values.yaml
      - --version
      # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
      - 41.6.0
      - --wait
      - --timeout
      - 180s
  - program: kubectl
    args: [rollout, status, deployment/traefik, -n, traefik, --timeout=180s]
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=90s]
  - program: sh
    args: [scripts/verify-clean.sh]

grading:
  - id: gateway-programmed
    weight: 1
    check:
      program: sh
      args: [scripts/check-gateway-programmed.sh]
  - id: httproute-accepted
    weight: 1
    check:
      program: sh
      args: [scripts/check-httproute-accepted.sh]
  - id: request-succeeds
    weight: 2
    check:
      program: sh
      args: [scripts/check-http-route.sh, app.example.com, /app]
