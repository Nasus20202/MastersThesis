scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [apply, -f, manifests/app.yaml, -n, basic-app]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-deployment-only
        repair:
          - program: kubectl
            args: [apply, -f, manifests/deployment-only.yaml, -n, basic-app]
        expected_score: 0.5
        expected_full_success: false
