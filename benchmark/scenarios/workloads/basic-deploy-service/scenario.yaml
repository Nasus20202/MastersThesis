id: basic-deploy-service
title: Deploy a workload and expose it with a Service
task: In namespace basic-app, create a Deployment named app using image nginx:1.31.5 with two replicas, and expose it with a ClusterIP Service named app on port 80.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, namespace, basic-app]

verify_clean:
  - program: sh
    args: [scripts/verify-clean.sh]

grading:
  - id: deployment-ready
    weight: 1
    check:
      program: kubectl
      args: [rollout, status, deployment/app, -n, basic-app, --timeout=90s]
  - id: service-responds
    weight: 1
    check:
      program: sh
      args: [scripts/check-service-response.sh]
