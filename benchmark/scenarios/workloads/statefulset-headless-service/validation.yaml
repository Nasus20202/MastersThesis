scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [create, -f, manifests/service-headless.yaml]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-wrong-port
        repair:
          - program: kubectl
            args: [create, -f, manifests/service-headless-wrong-port.yaml]
        expected_score: 0.5
        expected_full_success: false
