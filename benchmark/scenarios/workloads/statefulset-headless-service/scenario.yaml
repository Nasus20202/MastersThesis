id: statefulset-headless-service
title: StatefulSet stable per-Pod DNS
task: A StatefulSet's Pods are running, but other workloads cannot reach them through their stable per-Pod DNS names. Restore stable network identity for the StatefulSet's Pods.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/statefulset.yaml]
  - program: kubectl
    args: [rollout, status, statefulset/app, --timeout=120s]

verify_clean:
  - program: kubectl
    args: [rollout, status, statefulset/app, --timeout=60s]
  - program: sh
    args: [scripts/verify-clean.sh]

grading:
  - id: headless-service
    weight: 2
    check:
      program: sh
      args: [scripts/check-headless-service.sh]
  - id: pod-dns
    weight: 2
    check:
      program: sh
      args: [scripts/check-pod-dns.sh]
