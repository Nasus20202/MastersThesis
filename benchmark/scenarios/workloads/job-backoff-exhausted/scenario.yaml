id: job-backoff-exhausted
title: Job exhausted its backoff limit
task: A Kubernetes Job has failed and is not completing. Restore the Job so that it completes successfully.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [wait, --for=condition=complete, job/app, --timeout=60s]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: kubectl
    args: [wait, --for=condition=failed, job/app, --timeout=60s]

grading:
  - id: job-complete
    weight: 1
    check:
      program: kubectl
      args: [wait, --for=condition=complete, job/app, --timeout=60s]
  - id: job-succeeded
    weight: 1
    check:
      program: sh
      args: [scripts/check-job-succeeded.sh]
