scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [delete, job, app, --ignore-not-found]
          - program: kubectl
            args: [create, -f, manifests/app.yaml]
        expected_score: 1
        expected_full_success: true
