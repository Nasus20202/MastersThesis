id: rollback-bad-release
title: Roll back a bad release
task: A recent application release is not completing its rollout and the application is running with fewer available replicas than intended. Restore the application to a healthy state.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=90s]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]
  - program: sh
    args: [scripts/check-good-image.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: deployment-available
    weight: 2
    check:
      program: sh
      args: [scripts/check-deployment-available.sh]
  - id: good-image
    weight: 1
    check:
      program: sh
      args: [scripts/check-good-image.sh]
  - id: rollout-history
    weight: 1
    check:
      program: sh
      args: [scripts/check-rollout-history.sh]
