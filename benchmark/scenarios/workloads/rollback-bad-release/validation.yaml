scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [rollout, undo, deployment/app]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-recreate
        repair:
          - program: kubectl
            args: [delete, deployment, app, --cascade=foreground, --wait=true]
          - program: kubectl
            args: [create, -f, manifests/app.yaml]
        expected_score: 0.75
        expected_full_success: false
