scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"app","env":[{"name":"CONFIG_MESSAGE","valueFrom":{"configMapKeyRef":{"name":"app-config","key":"message"}}}]}]}}}}',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-wrong-key-value
        repair:
          - program: kubectl
            args:
              [
                patch,
                configmap,
                app-config,
                --type=merge,
                -p,
                '{"data":{"missing":"wrong"}}',
              ]
        expected_score: 0.5
        expected_full_success: false
