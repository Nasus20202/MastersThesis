id: configmap-missing-key
title: ConfigMap key missing from environment
tags:
  difficulty: easy
  task_type: troubleshooting
  knowledge: general
  area: configuration
sources:
  - path: content/en/docs/tasks/configure-pod-container/configure-pod-configmap.md
    sections:
      - Define container environment variables using ConfigMap data
task: A Kubernetes application rollout is not completing. Restore the application to a healthy state.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]
  - program: sh
    args: [scripts/check-config-message.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: deployment-ready
    weight: 1
    check:
      program: kubectl
      args: [rollout, status, deployment/app, --timeout=60s]
  - id: config-message
    weight: 1
    check:
      program: sh
      args: [scripts/check-config-message.sh]
