id: secret-ref-mismatch
title: Pod references a missing Secret key
task: A Kubernetes application rollout is not completing. Restore the application to a healthy state.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=90s]
  - program: sh
    args: [scripts/check-secret-value.sh, s3cr3t]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: pod-ready
    weight: 2
    check:
      program: kubectl
      args: [rollout, status, deployment/app, --timeout=120s]
  - id: secret-value
    weight: 1
    check:
      program: sh
      args: [scripts/check-secret-value.sh, s3cr3t]
