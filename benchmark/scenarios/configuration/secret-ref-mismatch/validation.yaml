scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"app","env":[{"name":"APP_PASSWORD","valueFrom":{"secretKeyRef":{"name":"app-secret","key":"password"}}}]}]}}}}',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-wrong-value
        repair:
          - program: kubectl
            args:
              [
                patch,
                secret,
                app-secret,
                --type=merge,
                -p,
                '{"stringData":{"missing-key":"wrong"}}',
              ]
        expected_score: 0.6666666666666666
        expected_full_success: false
