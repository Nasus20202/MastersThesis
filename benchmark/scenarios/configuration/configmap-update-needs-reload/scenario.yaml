id: configmap-update-needs-reload
title: ConfigMap update not visible to running Pods
task: The application configuration was updated to beta, but the running Pods still report alpha. Make the running Pods use the updated value.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=90s]
  - program: sh
    args: [scripts/check-reloaded-value.sh, alpha]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: pods-reloaded-value
    weight: 2
    check:
      program: sh
      args: [scripts/check-reloaded-value.sh, beta]
  - id: deployment-ready
    weight: 1
    check:
      program: sh
      args: [scripts/check-pod-ready.sh]
