id: immutable-configmap
title: Required ConfigMap update rejected as immutable
task: The application must run with the configuration value v2 but currently reports v1. Update the application configuration to v2 and make the running Pods use it.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=90s]
  - program: sh
    args: [scripts/check-consumed-value.sh, v1]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: configmap-value
    weight: 2
    check:
      program: sh
      args: [scripts/check-configmap-value.sh, v2]
  - id: pods-consumed-value
    weight: 1
    check:
      program: sh
      args: [scripts/check-consumed-value.sh, v2]
