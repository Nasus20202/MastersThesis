scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [delete, configmap, app-config, --ignore-not-found, --wait=true]
          - program: kubectl
            args: [create, -f, manifests/app-config-v2.yaml]
          - program: kubectl
            args: [rollout, restart, deployment/app]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-no-reload
        repair:
          - program: kubectl
            args:
              [delete, configmap, app-config, --ignore-not-found, --wait=true]
          - program: kubectl
            args: [create, -f, manifests/app-config-v2.yaml]
        expected_score: 0.6666666666666666
        expected_full_success: false
