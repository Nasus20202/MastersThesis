apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  message: healthy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-reader
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-reader
subjects:
  - kind: ServiceAccount
    name: api-reader
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      serviceAccountName: api-reader
      containers:
        - name: app
          image: busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - >-
              wget -q -O /dev/null --no-check-certificate
              --header "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              https://kubernetes.default.svc/api/v1/namespaces/default/configmaps/app-config
              && exec sleep 3600
