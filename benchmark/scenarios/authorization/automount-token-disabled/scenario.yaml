id: automount-token-disabled
title: Service account token not mounted
task: A workload in the cluster keeps crashing on startup and never becomes Ready. Restore it to a healthy state.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]
  - program: sh
    args: [scripts/check-api-access.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: api-call
    weight: 2
    check:
      program: sh
      args: [scripts/check-api-access.sh]
  - id: pod-ready
    weight: 1
    check:
      program: sh
      args: [scripts/check-pod-ready.sh]
