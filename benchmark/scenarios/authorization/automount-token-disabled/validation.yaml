scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=json,
                -p,
                '[{"op":"remove","path":"/spec/template/spec/automountServiceAccountToken"}]',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-no-api
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"containers":[{"name":"app","command":["sh","-c"],"args":["exec sleep 3600"]}]}}}}',
              ]
        expected_score: 0.3333333333333333
        expected_full_success: false
