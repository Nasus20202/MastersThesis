scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0.5
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                role,
                api-reader,
                --type=json,
                -p,
                '[{"op":"replace","path":"/rules","value":[{"apiGroups":[""],"resources":["configmaps"],"verbs":["get"]}]}]',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-no-binding
        repair:
          - program: kubectl
            args:
              [
                patch,
                role,
                api-reader,
                --type=json,
                -p,
                '[{"op":"replace","path":"/rules","value":[{"apiGroups":[""],"resources":["configmaps"],"verbs":["get"]}]}]',
              ]
          - program: kubectl
            args: [delete, rolebinding, api-reader]
        expected_score: 0.5
        expected_full_success: false
