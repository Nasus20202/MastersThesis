id: overprivileged-serviceaccount
title: Over-privileged service account
tags:
  difficulty: hard
  task_type: constructive
  knowledge: documentation-dependent
  area: authorization
sources:
  - path: content/en/docs/reference/access-authn-authz/rbac.md
    sections:
      - API objects > Aggregated ClusterRoles > Role examples
      - API objects > Referring to resources
      - ServiceAccount permissions
task: The application's service account has broader cluster permissions than the application uses. Reduce its permissions to the minimum the application needs without breaking the application.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]
  - program: sh
    args: [scripts/check-api-access.sh]
  - program: sh
    args: [scripts/check-least-privilege.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: api-access
    weight: 2
    check:
      program: sh
      args: [scripts/check-api-access.sh]
  - id: least-privilege
    weight: 2
    check:
      program: sh
      args: [scripts/check-least-privilege.sh]
