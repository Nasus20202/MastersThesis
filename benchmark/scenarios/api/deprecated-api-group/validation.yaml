scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [apply, -f, manifests/app.yaml, -n, legacy-app]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-scaled
        repair:
          - program: kubectl
            args: [apply, -f, manifests/app.yaml, -n, legacy-app]
          - program: kubectl
            args: [scale, deployment/app, -n, legacy-app, --replicas=1]
        expected_score: 0.6666666666666666
        expected_full_success: false
