id: deprecated-api-group
title: Manifest uses a removed API version
task: |-
  A team handed over the manifest below, but the cluster rejects it because it targets an API version that is no longer served. Rewrite it as an equivalent resource for the API version this cluster serves and apply it into the namespace legacy-app, keeping the same name, replicas, labels and image.

  apiVersion: apps/v1beta1
  kind: Deployment
  metadata:
    name: app
    labels:
      app: app
  spec:
    replicas: 3
    selector:
      matchLabels:
        app: app
    template:
      metadata:
        labels:
          app: app
      spec:
        containers:
          - name: app
            image: nginx:1.31.5
            ports:
              - name: http
                containerPort: 80

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, namespace, legacy-app]

verify_clean:
  - program: sh
    args: [scripts/verify-clean.sh]

grading:
  - id: correct-api-version
    weight: 2
    check:
      program: sh
      args: [scripts/check-api-version.sh]
  - id: workload-ready
    weight: 1
    check:
      program: sh
      args: [scripts/check-ready-replicas.sh]
