id: nonroot-securitycontext
title: Container rejected because it runs as root
task: A workload in the cluster is rejected and never starts. Make it run as a non-root user.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: pod-ready
    weight: 2
    check:
      program: sh
      args: [scripts/check-pod-ready.sh]
  - id: nonroot-uid
    weight: 1
    check:
      program: sh
      args: [scripts/check-nonroot-uid.sh]
