scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":1001}}}}}',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-root
        repair:
          - program: kubectl
            args:
              [
                patch,
                deployment,
                app,
                --type=strategic,
                -p,
                '{"spec":{"template":{"spec":{"securityContext":{"runAsNonRoot":false}}}}}',
              ]
        expected_score: 0.6666666666666666
        expected_full_success: false
