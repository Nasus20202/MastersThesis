id: psa-restricted-namespace
title: Pod rejected by Pod Security Admission
task: A workload in namespace restricted-app cannot start because its Pods are not being admitted. Make the workload run while keeping the namespace's security settings in place.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/namespace.yaml]
  - program: kubectl
    args: [create, -f, manifests/app.yaml, -n, restricted-app]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, -n, restricted-app, --timeout=90s]
  - program: sh
    args: [scripts/check-policy-labels.sh]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: pod-admitted
    weight: 2
    check:
      program: sh
      args: [scripts/check-pod-admitted.sh]
  - id: policy-labels-intact
    weight: 1
    check:
      program: sh
      args: [scripts/check-policy-labels.sh]
