scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0.3333333333333333
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [apply, -f, manifests/app.yaml, -n, restricted-app]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-lax-namespace
        repair:
          - program: kubectl
            args:
              [
                label,
                namespace,
                restricted-app,
                pod-security.kubernetes.io/enforce-,
                --overwrite,
              ]
        expected_score: 0.6666666666666666
        expected_full_success: false
