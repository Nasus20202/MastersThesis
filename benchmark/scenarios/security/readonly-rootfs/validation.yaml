scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args: [apply, -f, manifests/app-hardened.yaml]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-unhardened
        repair:
          - program: kubectl
            args: [apply, -f, manifests/app-unhardened-volumes.yaml]
        expected_score: 0.5
        expected_full_success: false
