id: readonly-rootfs
title: Read-only root filesystem breaks the application
tags:
  difficulty: medium
  task_type: troubleshooting
  knowledge: documentation-dependent
  area: security
sources:
  - path: content/en/docs/tasks/configure-pod-container/security-context.md
    sections:
      # The page introduction is also relevant.
      - Set the security context for a Container
task: The application rollout stopped completing after its container root filesystem was made read-only. Restore the application while keeping the root filesystem read-only.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/app.yaml]

verify_clean:
  - program: kubectl
    args: [rollout, status, deployment/app, --timeout=60s]

inject_fault:
  - program: sh
    args: [scripts/inject-fault.sh]

verify_fault:
  - program: sh
    args: [scripts/verify-fault.sh]

grading:
  - id: deployment-ready
    weight: 1
    check:
      program: kubectl
      args: [rollout, status, deployment/app, --timeout=60s]
  - id: workload-hardened
    weight: 1
    check:
      program: sh
      args: [scripts/check-hardened.sh]
