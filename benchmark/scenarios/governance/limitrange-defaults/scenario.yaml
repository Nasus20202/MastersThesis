id: limitrange-defaults
title: LimitRange provides default resources
task: The default namespace has a LimitRange that supplies default container resources. Create a Deployment named app in that namespace with image nginx:1.31.5 and two replicas, without setting container resources, so the Pods inherit the LimitRange defaults.

cluster:
  kind:
    config: ../../../kind/cluster.yaml

prepare:
  - program: kubectl
    args: [create, -f, manifests/limitrange.yaml]

verify_clean:
  - program: sh
    args: [scripts/verify-clean.sh]

grading:
  - id: deployment-ready
    weight: 1
    check:
      program: kubectl
      args: [rollout, status, deployment/app, --timeout=60s]
  - id: limitrange-applied
    weight: 1
    check:
      program: sh
      args: [scripts/check-limitrange-applied.sh]
