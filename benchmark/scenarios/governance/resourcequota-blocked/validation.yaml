scenarios:
  - scenario_file: scenario.yaml
    cases:
      - id: broken
        expected_score: 0.25
        expected_full_success: false

      - id: full-repair
        repair:
          - program: kubectl
            args:
              [
                patch,
                resourcequota,
                app-quota,
                --type=merge,
                -p,
                '{"spec":{"hard":{"pods":"3"}}}',
              ]
        expected_score: 1
        expected_full_success: true

      - id: partial-repair-scaled
        repair:
          - program: kubectl
            args: [scale, deployment/app, --replicas=1]
        expected_score: 0.5
        expected_full_success: false

      - id: partial-repair-quota-deleted
        repair:
          - program: kubectl
            args: [delete, resourcequota, app-quota]
        expected_score: 0.75
        expected_full_success: false
