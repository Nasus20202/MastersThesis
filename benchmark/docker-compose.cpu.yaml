# Runs the llama.cpp servers on the CPU for hosts without a Vulkan device, such
# as GitHub-hosted runners. Same llama.cpp build as the Vulkan image; the
# --n-gpu-layers argument is ignored by the CPU build.
x-cpu: &cpu
  image: ghcr.io/ggml-org/llama.cpp:server-b10964@sha256:283ed1799f2711361dadd863305ffe31c9fca3321a099712a8cc65061502b523

services:
  llama-server: *cpu
  llama-embedding: *cpu
