# Benchmark-specific settings. Llama.cpp runtime and model settings remain in
# config.env and model-profiles/*.env.
logging:
  level: info
  format: text
  color: auto

agents:
  loop:
    max_turns: 25
    max_tool_calls: 50
    tool_timeout_seconds: 60
    timeout_seconds: 600
  prompt:
    system_prompt_file: internal/agent/prompt/prompt.md
  skill:
    system_prompt_file: internal/agent/skill/prompt.md
    skills_dir: internal/agent/skill/skills

containers:
  sandbox:
    image: benchmark-sandbox:ubuntu-26.04
    dockerfile: docker/sandbox/Dockerfile.ubuntu-26.04
    context: docker/sandbox
  setup:
    image: benchmark-setup:ubuntu-26.04
    dockerfile: docker/setup/Dockerfile.ubuntu-26.04
    context: docker/setup
    network: kind
