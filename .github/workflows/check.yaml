name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: benchmark/go.mod
          cache-dependency-path: benchmark/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript tools
        run: npm ci

      - name: Test
        run: make test

      - name: Format
        run: |
          make format
          git diff --exit-code

      - name: Lint
        run: make lint

  benchmark-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: benchmark/go.mod
          cache-dependency-path: benchmark/go.sum

      - name: Install Kind and kubectl
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
          kubectl_version: v1.37.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build sandbox image
        uses: docker/build-push-action@v7
        with:
          context: benchmark/sandbox
          file: benchmark/sandbox/Dockerfile.ubuntu-26.04
          tags: benchmark-sandbox:ubuntu-26.04
          load: true
          cache-from: type=gha,scope=benchmark-sandbox:ubuntu-26.04
          cache-to: type=gha,mode=max,scope=benchmark-sandbox:ubuntu-26.04

      - name: Validate benchmark scenarios
        run: make benchmark-validate

      - name: Clean benchmark resources
        if: always()
        run: make docker-cleanup

      - name: Upload benchmark validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-validation-results
          path: benchmark/results/
          if-no-files-found: ignore
