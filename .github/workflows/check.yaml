name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: benchmark/go.mod
          cache-dependency-path: benchmark/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript tools
        run: npm ci

      - name: Test
        run: make test

      - name: Format
        run: |
          make format
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Check corpus
        run: make check-corpus
