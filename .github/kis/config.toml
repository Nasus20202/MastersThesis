# KaggleInferenceServer config for the Benchmark on Kaggle workflow, from the
# image's examples/config.32k.toml with only the benchmark's models.
#
# The server arguments and presets mirror the local llama.cpp setup, so a
# Kaggle run serves the same model the same way:
# - [server] ctx and args: benchmark/config.env (32K KV per slot, f16 cache,
#   flash attention auto, reasoning on with a 4096-token budget).
# - Each preset, named after its benchmark/model-profiles/*.env: repository,
#   revision, file, sha256, MTP drafter and LLAMA_SPEC_DRAFT_N_MAX; alias is
#   LLAMA_MODEL_NAME.
# - Sampling: benchmark/models-preset.ini, the vendors' recommended values.
# `parallel` is the calibrated slot count per llama-server instance; small
# models run one replica per T4, so a session has twice as many slots.

[kaggle]
username = "krzysztofnasuta"
accelerator = "NvidiaTeslaT4"
# llama.cpp release compiled by `kis build`.
llama_cpp_ref = "v0.6.0"

[tunnel]
kind = "cloudflared"
token = ""
public_url = ""
authkey = ""
hostname = "kaggle-llm"

[ntfy]
server = "https://ntfy.sh"
token = ""

[notify]
topic = ""
token = ""

[server]
idle_minutes = 10
max_hours = 11.5
# Off: every shard runs its own kis proxy, and each would start a new session.
rollover_hours = 0
replica_max_gb = 11.0
ctx = 32768
resident = ["embeddinggemma-300m"]
args = [
  "--n-gpu-layers", "999",
  "--flash-attn", "auto",
  "--cache-type-k", "f16",
  "--cache-type-v", "f16",
  "--reasoning", "on",
  "--reasoning-budget", "4096",
  "--batch-size", "2048",
  "--ubatch-size", "512",
  "--metrics",
]

# The retrieval index and the RAG agent's queries: benchmark/retrieval.env and
# the llama-embedding service in benchmark/docker-compose.yaml. Resident, so it
# runs beside every chat preset.
[models.embeddinggemma-300m]
repo = "ggml-org/embeddinggemma-300m-qat-q8_0-GGUF"
revision = "66f974f8cd48cc3b9c41c516b95508e75b4bee64"
file = "embeddinggemma-300m-qat-Q8_0.gguf"
sha256 = "6fa0c02a9c302be6f977521d399b4de3a46310a4f2621ee0063747881b673f67"
alias = "embeddinggemma-300m-qat-Q8_0"
parallel = 8
ctx = 2048
# Embedding inputs are not split, so a batch must hold a whole chunk.
args = ["--embeddings", "--n-gpu-layers", "999", "--batch-size", "2048", "--ubatch-size", "2048"]

[models.gemma-4-e2b]
repo = "unsloth/gemma-4-E2B-it-qat-GGUF"
