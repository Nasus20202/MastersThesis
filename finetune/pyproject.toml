[project]
name = "finetune"
version = "0.1.0"
description = "LoRA fine-tuning of the student models on benchmark agent trajectories"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jinja2==3.1.6",
  "transformers==5.17.0",
]

[project.optional-dependencies]
# Hugging Face transformers + PEFT, with bitsandbytes for 4-bit (QLoRA).
peft = [
  "accelerate==1.16.0",
  "bitsandbytes==0.50.2",
  # Triton kernels for Qwen3.5's linear-attention layers; without them
  # transformers falls back to a slow, memory-hungry PyTorch implementation.
  "flash-linear-attention==0.6.0",
  "peft==0.21.3",
  "torch==2.14.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.5",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
