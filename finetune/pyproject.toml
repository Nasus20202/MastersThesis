[project]
name = "finetune"
version = "0.1.0"
description = "LoRA fine-tuning of the student models on benchmark agent trajectories"
requires-python = ">=3.15,<3.16"
dependencies = [
  "jinja2==3.1.6",
  "pyyaml==6.0.3",
  "transformers==5.17.0",
]

[project.optional-dependencies]
# Hugging Face transformers + PEFT, with bitsandbytes for 4-bit (QLoRA).
peft = [
  "accelerate==1.16.0",
  "bitsandbytes==0.50.2",
  # Triton kernels for Qwen3.5's linear-attention layers; without them
  # transformers falls back to a slow, memory-hungry PyTorch implementation.
  "flash-linear-attention==0.6.0",
  "peft==0.21.3",
  "torch==2.15.0",
]
# Qwen3.5's short-convolution kernel; without it transformers falls back to a
# slow PyTorch version. No wheel exists for this torch and Python, so it is
# compiled from source, which needs the CUDA toolkit: only the Modal image
# (finetune.modal) installs it.
cuda = ["causal-conv1d==1.7.0"]

[dependency-groups]
dev = [
  "modal==1.6.4",
  "pytest==9.2.0",
  "ruff==0.17.5",
]

[tool.uv]
# causal-conv1d compiles against torch: build it with the pinned one.
build-constraint-dependencies = ["torch==2.15.0"]
extra-build-dependencies = { causal-conv1d = ["ninja", "packaging"] }

# Its metadata is only known by running its setup.py, which needs CUDA; given
# here so `uv lock` works on machines without it.
[[tool.uv.dependency-metadata]]
name = "causal-conv1d"
version = "1.7.0"
requires-dist = ["torch", "packaging", "ninja"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
