[project]
name = "finetune"
version = "0.1.0"
description = "LoRA fine-tuning of the student models on benchmark agent trajectories"
requires-python = ">=3.15,<3.16"
dependencies = [
  "jinja2==3.1.6",
  "pyyaml==6.0.4",
  "transformers==5.24.1",
]

[project.optional-dependencies]
# Hugging Face transformers + PEFT, with bitsandbytes for 4-bit (QLoRA).
peft = [
  "accelerate==1.16.0",
  "bitsandbytes==0.50.2",
  # Triton kernels for Qwen3.5's linear-attention layers; without them
  # transformers falls back to a slow, memory-hungry PyTorch implementation.
  "flash-linear-attention==0.6.0",
  "peft==0.22.0",
  "torch==2.14.1",
]
# Qwen3.5's short-convolution kernel for NVIDIA GPUs; without it transformers
# falls back to a slow PyTorch version. Only the Modal image installs it:
# transformers calls it whenever it is installed, also for CPU tensors (tests).
cuda = ["causal-conv1d==1.7.0"]

[dependency-groups]
dev = [
  "modal==1.6.4",
  "pytest==9.2.0",
  "ruff==0.17.6",
]

# torch and the causal-conv1d wheel built for it must use the same CUDA
# version (cuNNN). The wheel comes from Astral's GPU index
# (https://github.com/astral-sh-build/build-causal-conv1d), which serves only it.
[tool.uv.sources]
torch = { index = "pytorch-cuda" }
causal-conv1d = { index = "astral-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "astral-cuda"
url = "https://wheels.astral.sh/simple/cu132/"
explicit = true

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
