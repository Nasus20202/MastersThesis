    checkpoint: google/gemma-4-E4B-it-qat-q4_0-unquantized
    revision: 476025a01dbf99361c062bbeca3d6a76bb4c4566
    served_model: gemma-4-E4B-it-qat-UD-Q4_K_XL
  qwen35-4b:
