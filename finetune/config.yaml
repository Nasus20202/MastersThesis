# Fine-tuning settings, read by finetune.config. A value under a
# `# renovate:` comment is updated by Renovate. Checkpoint revisions and
# training values are research inputs: change them only with the
# researcher's approval.

modal:
  app: finetune
  gpu: A100-40GB # Modal GPU type; `--gpu` overrides it for one run
  cpu: 2 # one core drives the GPU; the run used about one
  memory_mib: 8192 # host RAM request, not a limit: Modal bills the larger of request and use
  timeout_minutes: 30 # per variant: a stuck run costs at most this
  # renovate: datasource=pypi depName=uv
  uv: 0.13.9
  results_volume: finetune-results
  cache_volume: finetune-hf-cache

# The llama.cpp release of the benchmark's server, for GGUF conversion and
# served perplexity (finetune.llama).
llama_cpp:
  image: ghcr.io/ggml-org/llama.cpp
  # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp
  cpu: full-b10964@sha256:c983c142e666c6d69797b789998790b26305c8b52305dcafa78ffcfb9e06a0ea
  # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp
  vulkan: full-vulkan-b10964@sha256:f4ab9e13181311d341b05d52dd4c324b66c592a7d4b90b7681c105febdc84e83

training:
  steps: 30
  rank: 16
  alpha: 16
  learning_rate: 1.0e-4
  warmup_steps: 3
  seed: 0
  # Longest trajectory trained on, in tokens; longer ones are dropped, never cut.
  max_len: 16384
  # Sequence lengths of the memory and speed sweep before training.
  sweep: [4096, 8192, 12288, 16384]
  # Language-model projections that get LoRA matrices: attention, Qwen3.5's
  # Gated DeltaNet inputs, MLP. Gated DeltaNet's out_proj stays without: the
  # pinned llama.cpp cannot convert a LoRA on it (#24).
  lora_modules:
    [
      q_proj,
      k_proj,
      v_proj,
      o_proj,
      in_proj_qkv,
      in_proj_z,
      gate_proj,
      up_proj,
      down_proj,
    ]

# Development scenarios kept out of training to select the adapter (D-055):
# one per area; two easy, four medium, two hard (#24).
validation_scenarios:
  - configmap-missing-key
  - unschedulable-cpu-request
  - dns-name-resolution
  - stale-image-ifnotpresent
  - antiaffinity-unschedulable
  - hostpath-fsgroup
  - missing-rbac-binding
  - container-crash-loop

# The four benchmark models (D-053). Each checkpoint is the base model the
# served GGUF's model card declares; the served files are pinned in
# benchmark/model-profiles.
students:
  gemma-4-e2b:
    family: gemma
    checkpoint: google/gemma-4-E2B-it-qat-q4_0-unquantized
    revision: 6befbaca7398925921802abd1f277b495b78b738
    served_model: gemma-4-E2B-it-qat-UD-Q4_K_XL
  gemma-4-e4b:
